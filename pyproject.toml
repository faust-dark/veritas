[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.1.0"
description = "Adversarial verification (Proposer/Critic/Judge) on the OpenMinion 0.1 SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "faust-dark" }]
dependencies = ["openminion==0.1.14"]

[project.scripts]
veritas = "veritas.cli:main"

[tool.setuptools.packages.find]
include = ["veritas*"]
